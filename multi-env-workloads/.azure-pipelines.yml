trigger:
  branches:
    include:
      - main


pr:
  branches:
    include:
      - main


variables:
  # Name of the Azure service connection (ARM) created in ADO Project settings -> Service connections
  azureServiceConnection: 'ESSS-ARM-SC'   

  # Location of the Bicep entrypoint relative to repo root
  bicepTemplatePath: 'esss/main.bicep'

  # Parameter file paths per environment (relative to repo root)
  devParameters:  'esss/dev.parameters.json'
  testParameters: 'esss/test.parameters.json'
  uatParameters:  'esss/uat.parameters.json'

  # Resource groups where the deployment happens (these RGs should exist)
  devRG:  'esss-dev-rg'
  testRG: 'esss-test-rg'
  uatRG:  'esss-uat-rg'

stages:
  - stage: Dev
    displayName: 'Deploy - DEV'
    jobs:
      - deployment: deployDev
        displayName: 'Deploy DEV (Bicep)'
        environment: 'esss-dev'        #  environment in ADO 
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy Bicep to DEV'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Deploying DEV using parameters: $(devParameters)"
                      az --version
                      az group show -n $(devRG) || (echo "Resource group $(devRG) not found"; exit 1)
                      az deployment group create \
                        --resource-group $(devRG) \
                        --template-file $(bicepTemplatePath) \
                        --parameters @$(devParameters) \
                        --only-show-errors

  - stage: Test
    displayName: 'Deploy - TEST (Requires approval)'
    dependsOn: Dev
    condition: succeeded()
    jobs:
      - deployment: deployTest
        displayName: 'Deploy TEST (Bicep)'
        environment: 'esss-test'     # Attach pre-deployment approval check to this environment in ADO
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy Bicep to TEST'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Deploying TEST using parameters: $(testParameters)"
                      az group show -n $(testRG) || (echo "Resource group $(testRG) not found"; exit 1)
                      az deployment group create \
                        --resource-group $(testRG) \
                        --template-file $(bicepTemplatePath) \
                        --parameters @$(testParameters) \
                        --only-show-errors

  - stage: UAT
    displayName: 'Deploy - UAT (Requires approval)'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - deployment: deployUAT
        displayName: 'Deploy UAT (Bicep)'
        environment: 'esss-uat'      # Attach pre-deployment approval check to this environment
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy Bicep to UAT'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Deploying UAT using parameters: $(uatParameters)"
                      az group show -n $(uatRG) || (echo "Resource group $(uatRG) not found"; exit 1)
                      az deployment group create \
                        --resource-group $(uatRG) \
                        --template-file $(bicepTemplatePath) \
                        --parameters @$(uatParameters) \
                        --only-show-errors
