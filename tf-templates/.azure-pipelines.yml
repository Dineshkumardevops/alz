trigger:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.6.6'
  workingDirectory: 'multi-env-workloads/esss'

  # Azure Service Connection name
  azureServiceConnection: 'ESS-ARM-SC'

stages:

# =========================
# DEV STAGE
# =========================
- stage: DEV
  displayName: 'Terraform Deploy - DEV'
  jobs:
    - deployment: TerraformDEV
      displayName: 'Deploy DEV'
      environment: 'esss-dev'   # Optional environment (no approval)
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - task: TerraformInstaller@1
                displayName: 'Install Terraform'
                inputs:
                  terraformVersion: $(terraformVersion)

              - task: TerraformTaskV4@4
                displayName: 'Terraform Init (DEV)'
                inputs:
                  provider: 'azurerm'
                  command: 'init'
                  backendServiceArm: $(azureServiceConnection)
                  backendAzureRmResourceGroupName: 'tfstate-rg'
                  backendAzureRmStorageAccountName: 'tfstateaccount'
                  backendAzureRmContainerName: 'tfstate'
                  backendAzureRmKey: 'esss-dev.tfstate'
                  workingDirectory: $(workingDirectory)

              - task: TerraformTaskV4@4
                displayName: 'Terraform Plan (DEV)'
                inputs:
                  provider: 'azurerm'
                  command: 'plan'
                  environmentServiceNameAzureRM: $(azureServiceConnection)
                  commandOptions: '-var-file=dev.tfvars'
                  workingDirectory: $(workingDirectory)

              - task: TerraformTaskV4@4
                displayName: 'Terraform Apply (DEV)'
                inputs:
                  provider: 'azurerm'
                  command: 'apply'
                  environmentServiceNameAzureRM: $(azureServiceConnection)
                  commandOptions: '-auto-approve -var-file=dev.tfvars'
                  workingDirectory: $(workingDirectory)

# =========================
# UAT STAGE (WITH APPROVAL)
# =========================
- stage: UAT
  displayName: 'Terraform Deploy - UAT'
  dependsOn: DEV
  condition: succeeded()

  jobs:
    - deployment: TerraformUAT
      displayName: 'Deploy UAT'
      environment: 'esss-uat'   # 👈 Approval gate applied here
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - task: TerraformInstaller@1
                displayName: 'Install Terraform'
                inputs:
                  terraformVersion: $(terraformVersion)

              - task: TerraformTaskV4@4
                displayName: 'Terraform Init (UAT)'
                inputs:
                  provider: 'azurerm'
                  command: 'init'
                  backendServiceArm: $(azureServiceConnection)
                  backendAzureRmResourceGroupName: 'tfstate-rg'
                  backendAzureRmStorageAccountName: 'tfstateaccount'
                  backendAzureRmContainerName: 'tfstate'
                  backendAzureRmKey: 'esss-uat.tfstate'
                  workingDirectory: $(workingDirectory)

              - task: TerraformTaskV4@4
                displayName: 'Terraform Plan (UAT)'
                inputs:
                  provider: 'azurerm'
                  command: 'plan'
                  environmentServiceNameAzureRM: $(azureServiceConnection)
                  commandOptions: '-var-file=uat.tfvars'
                  workingDirectory: $(workingDirectory)

              - task: TerraformTaskV4@4
                displayName: 'Terraform Apply (UAT)'
                inputs:
                  provider: 'azurerm'
                  command: 'apply'
                  environmentServiceNameAzureRM: $(azureServiceConnection)
                  commandOptions: '-auto-approve -var-file=uat.tfvars'
                  workingDirectory: $(workingDirectory)
